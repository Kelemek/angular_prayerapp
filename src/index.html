<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <!-- Viewport meta for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Cross Pointe Church prayer request platform. Submit prayer requests, view community prayers, and stay connected with our church community." />
    <!-- Align browser chrome/safe-area color with header background instead of green brand color -->
    <meta name="theme-color" content="#E8E5E1" />
    
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://eqiafsygvfaifhoaewxi.supabase.co" />
    <link rel="dns-prefetch" href="https://api.planningcenteronline.com" />
    <!-- Inline critical CSS for faster FCP -->
    <style>
      :root { color-scheme: light dark; }
      body { background-color: #E8E5E1; margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
      /* Align dark body background with app shell container so header and safe-area overlay blend consistently */
      html.dark body { background-color: #2B2B2B; }
      html.black body { background-color: #000000; }
      html.day body { background-color: #F5F7FA; }
      html.blossom body { background-color: #FCE8EE; }
      html.blossom-dark body { background-color: #2D1A28; }
      html.christmas-light body { background-color: #F0E2C4; }
      html.christmas-dark body { background-color: #0A1F18; }
      
      /* Prevent iOS zoom on input focus */
      input[type="text"], input[type="email"], textarea, select {
        font-size: 16px;
      }

      /* Boot splash — matches login MFA dual emerald spinner (no Tailwind yet) */
      #cp-boot-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .cp-boot-spinner {
        position: relative;
        width: 3rem;
        height: 3rem;
      }
      .cp-boot-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
        animation: cp-boot-spin 1s linear infinite;
      }
      .cp-boot-spinner-ring-outer {
        border-top-color: #10b981;
        border-right-color: #10b981;
      }
      html.dark .cp-boot-spinner-ring-outer {
        border-top-color: #34d399;
        border-right-color: #34d399;
      }
      .cp-boot-spinner-ring-inner {
        inset: 4px;
        border-bottom-color: #6ee7b7;
        animation-direction: reverse;
        animation-duration: 1.5s;
      }
      html.dark .cp-boot-spinner-ring-inner {
        border-bottom-color: #059669;
      }
      @keyframes cp-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <title>Cross Pointe Church - Prayer Requests</title>
    <script src="/boot-recovery.js"></script>
    <script>
      // Apply theme immediately (family + mode) — keep in sync with ThemeService
      (function() {
        var THEME_F = 'themeFamily';
        var THEME_M = 'themeMode';
        var LEGACY = 'theme';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        function migrateLegacy(t) {
          switch (t) {
            case 'light': return { family: 'default', mode: 'light' };
            case 'dark': return { family: 'default', mode: 'dark' };
            case 'black': return { family: 'high-contrast', mode: 'dark' };
            case 'blossom': return { family: 'blossom', mode: 'light' };
            case 'christmas-light': return { family: 'christmas', mode: 'light' };
            case 'christmas-dark': return { family: 'christmas', mode: 'dark' };
            case 'system':
            default: return { family: 'default', mode: 'system' };
          }
        }

        function lightOf(family) {
          if (family === 'default') return 'light';
          if (family === 'high-contrast') return 'day';
          if (family === 'blossom') return 'blossom';
          return 'christmas-light';
        }
        function darkOf(family) {
          if (family === 'default') return 'dark';
          if (family === 'high-contrast') return 'black';
          if (family === 'blossom') return 'blossom-dark';
          return 'christmas-dark';
        }
        function resolve(family, mode) {
          if (mode === 'system') {
            return prefersDark ? darkOf(family) : lightOf(family);
          }
          return mode === 'light' ? lightOf(family) : darkOf(family);
        }

        var fam = localStorage.getItem(THEME_F);
        var mod = localStorage.getItem(THEME_M);
        var sel =
          ['default', 'high-contrast', 'blossom', 'christmas'].indexOf(fam) !== -1 &&
          ['light', 'dark', 'system'].indexOf(mod) !== -1
            ? { family: fam, mode: mod }
            : migrateLegacy(localStorage.getItem(LEGACY) || 'system');

        var resolved = resolve(sel.family, sel.mode);
        var overlays = ['black', 'blossom', 'blossom-dark', 'christmas-light', 'christmas-dark', 'day'];
        var isDark =
          resolved === 'dark' ||
          resolved === 'black' ||
          resolved === 'blossom-dark' ||
          resolved === 'christmas-dark';

        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        for (var o = 0; o < overlays.length; o++) {
          root.classList.toggle(overlays[o], resolved === overlays[o]);
        }

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          var themeColor = '#E8E5E1';
          if (resolved === 'day') themeColor = '#F5F7FA';
          else if (resolved === 'black') themeColor = '#000000';
          else if (resolved === 'blossom') themeColor = '#FCE8EE';
          else if (resolved === 'blossom-dark') themeColor = '#2D1A28';
          else if (resolved === 'christmas-light') themeColor = '#F0E2C4';
          else if (resolved === 'christmas-dark') themeColor = '#0A1F18';
          else if (resolved === 'dark') themeColor = '#1F2937';
          else if (resolved === 'light') themeColor = '#E8E5E1';
          meta.setAttribute('content', themeColor);
        }
      })();
      
      // Load cached logo URLs immediately to prevent flash
      (function() {
        const lightLogo = localStorage.getItem('branding_light_logo');
        const darkLogo = localStorage.getItem('branding_dark_logo');
        const useLogo = localStorage.getItem('branding_use_logo');
        
        if (lightLogo || darkLogo || useLogo) {
          // Store in window object for Angular to access instantly
          window.__cachedLogos = {
            light: lightLogo,
            dark: darkLogo,
            useLogo: useLogo === 'true'
          };
          
          // Add link preload hints for cached logos
          // This tells browser to prioritize loading these images if they're data URLs
          if (lightLogo && lightLogo.startsWith('data:')) {
            const lightLink = document.createElement('link');
            lightLink.rel = 'preload';
            lightLink.as = 'image';
            lightLink.href = lightLogo;
            lightLink.media = '(prefers-color-scheme: light)';
            document.head.appendChild(lightLink);
          }
          
          if (darkLogo && darkLogo.startsWith('data:')) {
            const darkLink = document.createElement('link');
            darkLink.rel = 'preload';
            darkLink.as = 'image';
            darkLink.href = darkLogo;
            darkLink.media = '(prefers-color-scheme: dark)';
            document.head.appendChild(darkLink);
          }
        }
      })();

      // Mark native Capacitor app so we can scope safe-area behavior
      (function() {
        try {
          if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) {
            document.documentElement.classList.add('native-app');
          }
        } catch (e) {
          // Ignore - defaults to web behavior
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div id="cp-boot-splash" aria-busy="true" aria-live="polite">
        <div class="cp-boot-spinner">
          <div class="cp-boot-spinner-ring cp-boot-spinner-ring-outer"></div>
          <div class="cp-boot-spinner-ring cp-boot-spinner-ring-inner"></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
