<div [class]="groupsPanelClass">
  <div [class]="chipRowClass">
    <app-home-sub-filter-chip
      chipAriaLabel="Add a prayer or group"
      [stretch]="false"
      [active]="false"
      [layoutClass]="addGroupChipLayoutClass"
      [activeClass]="groupChipActive"
      [inactiveClass]="groupChipInactive"
      (chipClick)="openGroupsExplainer.emit()"
    >
      <svg
        class="size-6 shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </app-home-sub-filter-chip>
    <app-home-sub-filter-chip
      [active]="status === 'current'"
      [activeClass]="statusThemes.current.active"
      [inactiveClass]="groupChipInactive"
      (chipClick)="selectStatus('current')"
    >
      Current (3)
    </app-home-sub-filter-chip>
    <app-home-sub-filter-chip
      [active]="status === 'answered'"
      [activeClass]="statusThemes.answered.active"
      [inactiveClass]="groupChipInactive"
      (chipClick)="selectStatus('answered')"
    >
      Answered (1)
    </app-home-sub-filter-chip>
    <app-home-sub-filter-chip
      [active]="status === 'total'"
      [activeClass]="statusThemes.total.active"
      [inactiveClass]="groupChipInactive"
      (chipClick)="selectStatus('total')"
    >
      Total (4)
    </app-home-sub-filter-chip>
  </div>

  <div [class]="chipRowClass + ' mt-2'">
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectGroupChip('larson')"
        [class]="groupChipClass(selectedGroupChip === 'larson')"
      >
        Larson Family (2)
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectGroupChip('care')"
        [class]="groupChipClass(selectedGroupChip === 'care')"
      >
        Care Team (1)
      </button>
    </div>
  </div>
</div>
