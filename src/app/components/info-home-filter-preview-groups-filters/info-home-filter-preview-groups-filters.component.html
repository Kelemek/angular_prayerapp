<div [class]="groupsPanelClass">
  <div [class]="chipRowClass">
    <div class="flex min-w-max flex-[1_1_0] max-w-[min(100%,max(calc((100%-0.5rem)/2),max-content))] sm:max-w-[min(100%,max(calc((100%-1rem)/3),max-content))]">
      <button
        type="button"
        aria-label="Add a prayer or group"
        (click)="openGroupsExplainer.emit()"
        [class]="addGroupChipLayoutClass + ' ' + groupChipInactive + ' cursor-pointer w-full'"
      >
        <svg
          class="size-6 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.25"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectStatus('current')"
        [class]="statusChipClass(status === 'current', 'current')"
      >
        Current (3)
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectStatus('answered')"
        [class]="statusChipClass(status === 'answered', 'answered')"
      >
        Answered (1)
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectStatus('total')"
        [class]="statusChipClass(status === 'total', 'total')"
      >
        Total (4)
      </button>
    </div>
  </div>

  <div [class]="chipRowClass + ' mt-2'">
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectGroupChip('larson')"
        [class]="groupChipClass(selectedGroupChip === 'larson')"
      >
        Larson Family (2)
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        (click)="selectGroupChip('care')"
        [class]="groupChipClass(selectedGroupChip === 'care')"
      >
        Care Team (1)
      </button>
    </div>
  </div>
</div>
