<app-admin-prompt-manager-section
  [expanded]="sectionExpanded"
  (toggle)="onSectionToggle()"
>
  <app-admin-prompt-manager-panel
    #panelRef
    [showCSVUpload]="showCSVUpload"
    [showAddForm]="showAddForm"
    [error]="error"
    [success]="success"
    [searchQuery]="searchQuery"
    [searching]="searching"
    [hasSearched]="hasSearched"
    [promptSearchMinChars]="promptSearchMinChars"
    [promptSearchDebounceMs]="promptSearchDebounceMs"
    [prompts]="prompts"
    [prayerTypes]="prayerTypes"
    [editingId]="editingId"
    (toggleCsv)="toggleCSVUpload()"
    (toggleAdd)="toggleAddForm()"
    (searchQueryChange)="onPromptSearchQueryChange($event)"
    (searchKeydown)="onPromptSearchKeydown($event)"
    (clearSearch)="clearPromptSearch()"
    (closeCsv)="closeCsvUpload()"
    (csvUploaded)="onCsvUploaded($event)"
    (csvError)="onChildError($event)"
    (promptCreated)="onPromptCreated($event)"
    (closeAddForm)="closeAddForm()"
    (addFormError)="onChildError($event)"
    (promptEdited)="onPromptEdited($event)"
    (cancelEdit)="cancelEdit()"
    (editPrompt)="handleEdit($event)"
    (deletePrompt)="handleDelete($event.id, $event.title)"
  />
</app-admin-prompt-manager-section>

<app-admin-prompt-manager-dialogs
  #dialogsRef
  (deleteConfirmed)="onDeleteConfirmed($event)"
></app-admin-prompt-manager-dialogs>
