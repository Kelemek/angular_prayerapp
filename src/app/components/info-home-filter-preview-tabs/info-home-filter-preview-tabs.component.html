<!-- Filter-style preview tabs (mock of home filters): Church, Group, Personal, Memorize -->
<div class="flex w-full gap-1 mb-0">
  <button
    type="button"
    (click)="selectPublicPreviewTab()"
    title="Show church prayers"
    [class]="tabClass('public', isPublicTabActive())"
  >
    <app-home-filter-badge-button
      [count]="1"
      [compact]="true"
      title="About badges"
      ariaLabel="About badges"
      (markRead)="openBadges.emit()"
    />
    Church
  </button>
  <button
    type="button"
    (click)="selectGroupsPreviewTab()"
    title="Show group prayers"
    [class]="tabClass('groups', isGroupsTabActive())"
  >
    Group
  </button>
  <button
    type="button"
    (click)="setPreviewFilter('personal')"
    title="Show your personal prayers"
    [class]="tabClass('personal', previewFilter === 'personal')"
  >
    Personal
  </button>
  <button
    type="button"
    id="tour-filter-memorize"
    (click)="setPreviewFilter('memorize')"
    title="Memorize Bible verses"
    [class]="tabClass('memorize', previewFilter === 'memorize')"
  >
    Memorize
  </button>
</div>

@if (isPublicTabActive()) {
<div [class]="publicPanelGroupClass + ' ' + chipRowClass">
  <app-home-sub-filter-chip
    chipAriaLabel="Add a church prayer"
    [stretch]="false"
    [active]="false"
    [layoutClass]="addPrayerChipLayoutClass"
    [activeClass]="chipThemes.current.active"
    [inactiveClass]="chipThemes.current.inactive"
    (chipClick)="openAddChurchPrayer.emit()"
  >
    <svg
      class="size-6 shrink-0"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.25"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
  </app-home-sub-filter-chip>
  <app-home-sub-filter-chip
    [active]="previewFilter === 'current'"
    [activeClass]="chipThemes.current.active"
    [inactiveClass]="chipThemes.current.inactive"
    (chipClick)="setPreviewFilter('current')"
  >
    Current (9)
  </app-home-sub-filter-chip>
  <app-home-sub-filter-chip
    [active]="previewFilter === 'answered'"
    [activeClass]="chipThemes.answered.active"
    [inactiveClass]="chipThemes.answered.inactive"
    (chipClick)="setPreviewFilter('answered')"
  >
    Answered (2)
  </app-home-sub-filter-chip>
  <app-home-sub-filter-chip
    [active]="previewFilter === 'archived'"
    [activeClass]="chipThemes.archived.active"
    [inactiveClass]="chipThemes.archived.inactive"
    (chipClick)="setPreviewFilter('archived')"
  >
    Archived (8)
  </app-home-sub-filter-chip>
  <app-home-sub-filter-chip
    [active]="previewFilter === 'total'"
    [activeClass]="chipThemes.total.active"
    [inactiveClass]="chipThemes.total.inactive"
    (chipClick)="setPreviewFilter('total')"
  >
    Total (19)
  </app-home-sub-filter-chip>
  <app-home-sub-filter-chip
    [active]="previewFilter === 'prompts'"
    [activeClass]="chipThemes.prompts.active"
    [inactiveClass]="chipThemes.prompts.inactive"
    (chipClick)="setPreviewFilter('prompts')"
  >
    Prompts (12)
  </app-home-sub-filter-chip>
</div>
}

@if (isGroupsTabActive()) {
<app-info-home-filter-preview-groups-filters
  [status]="groupsPreviewStatus()"
  [selectedGroupChip]="selectedGroupChip"
  (statusChange)="setGroupsStatus($event)"
  (selectedGroupChipChange)="setSelectedGroupChip($event)"
  (openGroupsExplainer)="openGroupsExplainer.emit()"
/>
}

@if (previewFilter === 'personal') {
<app-info-home-filter-preview-personal-filters
  (openPersonalCategories)="openPersonalCategories.emit()"
/>
}

@if (previewFilter === 'prompts') {
<app-info-home-filter-preview-prompts-filters
  [attachedUnderPublic]="true"
  (openPromptCategories)="openPromptCategories.emit()"
/>
}

@if (previewFilter === 'memorize') {
<div [class]="memorizePanelGroupClass() + ' ' + chipRowClass">
  <div [class]="chipHostClass">
    <button
      type="button"
      [class]="memorizeChipClass(true)"
      (click)="openMemorizeAction.emit('add-verses')"
    >
      Add Verses
    </button>
  </div>
  <div [class]="chipHostClass">
    <button
      type="button"
      [class]="memorizeChipClass(false)"
      (click)="openMemorizeAction.emit('bible-books')"
    >
      Bible Books
    </button>
  </div>
  <div [class]="chipHostClass">
    <button
      type="button"
      [class]="memorizeChipClass(false)"
      (click)="openMemorizeAction.emit('recommended')"
    >
      Recommended
    </button>
  </div>
</div>
}
