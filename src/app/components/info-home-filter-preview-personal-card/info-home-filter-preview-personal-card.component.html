<div
  class="relative bg-gray-100/80 dark:bg-white/5 border-[2px] !border-gray-300 dark:!border-gray-600 rounded-lg p-4 sm:p-5 shadow-md space-y-3"
>
  <span
    class="absolute left-1/2 top-4 transform -translate-x-1/2 -translate-y-1/2 text-xs text-gray-500 dark:text-gray-400"
    >Jan 14, 2025</span
  >
  <div class="flex items-center justify-between mb-1">
    <div class="flex flex-wrap items-center gap-2">
      <h3
        class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-0"
      >
        Prayer for Riley
      </h3>
      <span
        class="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300 border border-blue-300 dark:border-blue-700"
        >Health</span
      >
    </div>
    <div class="flex items-center gap-1">
      <button
        type="button"
        (click)="openPersonalAction.emit('answered')"
        class="p-1 text-gray-400 dark:text-gray-500 rounded-md hover:text-green-600 dark:hover:text-green-400 hover:bg-green-50 dark:hover:bg-green-900/20 focus:outline-none focus:ring-2 focus:ring-green-500 cursor-pointer"
        title="Mark as answered"
        aria-label="Mark as answered"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button
        type="button"
        (click)="openPersonalAction.emit('edit')"
        class="p-1 text-blue-500 dark:text-blue-400 rounded-md hover:bg-blue-50 dark:hover:bg-blue-900/20 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
        title="Edit prayer"
        aria-label="Edit prayer"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          ></path>
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          ></path>
        </svg>
      </button>
      <button
        type="button"
        (click)="openPersonalAction.emit('delete')"
        class="p-1 text-red-500 dark:text-red-400 rounded-md hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer"
        title="Delete prayer"
        aria-label="Delete prayer"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
        </svg>
      </button>
    </div>
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300">
    Give every person a private list of their own prayers that only they can see
    and update.
  </p>
  <p class="text-xs text-gray-500 dark:text-gray-500">
    Personal prayers never appear on the public list, but they live in the same
    simple interface. Organize with categories and reorder by dragging.
  </p>
</div>
