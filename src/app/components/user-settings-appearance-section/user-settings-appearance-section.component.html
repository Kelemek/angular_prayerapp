<!-- Theme Selector -->
      <div
        id="tour-settings-theme"
        class="settings-modal-section-card rounded-lg p-3 sm:p-4"
      >
        <div class="flex items-start gap-2 sm:gap-3">
          <div class="flex-1">
            <div
              class="font-medium text-gray-800 dark:text-gray-100 mb-3 text-sm sm:text-base"
            >
              Theme Preference
            </div>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
              <div>
                <div class="mb-1.5 text-xs font-medium text-gray-600 dark:text-gray-400">Family</div>
                <app-theme-select-dropdown
                  [value]="host.theme.family"
                  [options]="host.themeFamilyOptions"
                  [triggerLabelOverride]="host.familyTriggerLabel"
                  iconVariant="family"
                  dropdownKey="user-settings-theme-family"
                  (valueChange)="host.handleThemeFamilyChange($event)"
                />
              </div>
              <div>
                <div class="mb-1.5 text-xs font-medium text-gray-600 dark:text-gray-400">Mode</div>
                <app-theme-select-dropdown
                  [value]="host.theme.mode"
                  [options]="host.themeModeOptions"
                  iconVariant="mode"
                  dropdownKey="user-settings-theme-mode"
                  (valueChange)="host.handleThemeModeChange($event)"
                />
              </div>
            </div>
            <p
              class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mt-2"
            >
              Pick a theme family and Light, Dark, or System (follows your device within that family)
            </p>
            <app-user-settings-success-alert
              [message]="host.successTheme"
              [extraTopMargin]="true"
            />
          </div>
        </div>
      </div>

      <!-- Text size -->
      <div
        id="tour-settings-text-size"
        class="settings-modal-section-card rounded-lg p-3 sm:p-4"
      >
        <div class="flex items-start gap-2 sm:gap-3">
          <div class="flex-1">
            <div
              class="font-medium text-gray-800 dark:text-gray-100 mb-3 text-sm sm:text-base"
            >
              Text size
            </div>
            <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
              <button
                (click)="host.handleTextSizeChange('normal')"
                [ngClass]="{
                  'border-blue-500 bg-blue-200 dark:bg-blue-900/20':
                    host.textSize === 'normal',
                  'border-church-surface-inactive-border dark:border-gray-700 bg-church-surface-inactive dark:bg-gray-800 hover:border-blue-300 dark:hover:border-blue-600':
                    host.textSize !== 'normal'
                }"
                title="Default text size"
                class="flex flex-col items-center gap-1 sm:gap-2 p-2 sm:p-3 rounded-lg border-2 transition-all cursor-pointer"
              >
                <span
                  class="text-[14px] font-medium text-gray-800 dark:text-gray-100"
                  >Default</span
                >
              </button>
              <button
                (click)="host.handleTextSizeChange('large')"
                [ngClass]="{
                  'border-blue-500 bg-blue-200 dark:bg-blue-900/20':
                    host.textSize === 'large',
                  'border-church-surface-inactive-border dark:border-gray-700 bg-church-surface-inactive dark:bg-gray-800 hover:border-blue-300 dark:hover:border-blue-600':
                    host.textSize !== 'large'
                }"
                title="Larger text"
                class="flex flex-col items-center gap-1 sm:gap-2 p-2 sm:p-3 rounded-lg border-2 transition-all cursor-pointer"
              >
                <span
                  class="text-[15px] font-medium text-gray-800 dark:text-gray-100"
                  >Larger</span
                >
              </button>
              <button
                (click)="host.handleTextSizeChange('largest')"
                [ngClass]="{
                  'border-blue-500 bg-blue-200 dark:bg-blue-900/20':
                    host.textSize === 'largest',
                  'border-church-surface-inactive-border dark:border-gray-700 bg-church-surface-inactive dark:bg-gray-800 hover:border-blue-300 dark:hover:border-blue-600':
                    host.textSize !== 'largest'
                }"
                title="Largest text"
                class="flex flex-col items-center gap-1 sm:gap-2 p-2 sm:p-3 rounded-lg border-2 transition-all cursor-pointer"
              >
                <span
                  class="text-[16px] font-medium text-gray-800 dark:text-gray-100"
                  >Largest</span
                >
              </button>
            </div>
            <p
              class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mt-2"
            >
              Make on-screen text larger for easier reading
            </p>
            <app-user-settings-success-alert
              [message]="host.successTextSize"
              [extraTopMargin]="true"
            />
          </div>
        </div>
      </div>
