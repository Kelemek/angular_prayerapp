<app-info-home-filter-preview-prayer-mock
  borderClass="!border-[#0047AB] dark:!border-[#0047AB]"
  prayerCreatedAt="2025-01-12T10:30:00.000Z"
  [showStatus]="true"
  status="current"
>
  <div [class]="'flex flex-wrap items-center gap-2 mb-2'">
    <span class="text-lg font-semibold text-gray-800 dark:text-gray-100">
      Prayer for Marcus
    </span>
    <span class="text-sm text-gray-600 dark:text-gray-400">
      Requested by:
      <span class="font-medium text-gray-800 dark:text-gray-100">Sarah</span>
    </span>
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300 mb-3">
    See every active request in one place so your church always knows what needs
    prayer right now.
  </p>
  <div class="flex flex-wrap gap-1 items-center mb-4">
    <button
      type="button"
      (click)="openHeaderPreview.emit('card-update')"
      title="Add an update to this prayer"
      class="px-3 py-1 text-xs font-medium btn-chip btn-chip-green"
    >
      Add Update
    </button>
    <button
      type="button"
      (click)="openHeaderPreview.emit('card-pray-for')"
      title="Record that you prayed for this request"
      class="px-3 py-1 text-xs font-medium btn-chip btn-chip-blue"
    >
      Pray For
    </button>
  </div>
  <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
    Recent Updates
  </h4>
  <app-prayer-update-row
    [update]="sampleUpdate"
    size="sm"
    shellClass="rounded-lg"
    contentClass="block text-sm text-gray-700 dark:text-gray-300"
    [showUpdatedBy]="true"
  >
    <button
      updateCorner
      type="button"
      (click)="openBadges.emit()"
      class="absolute -top-2 -right-2 inline-flex items-center justify-center w-5 h-5 sm:w-6 sm:h-6 bg-[#39704D] dark:bg-[#39704D] text-white rounded-full text-xs font-bold hover:bg-[#2d5a3f] dark:hover:bg-[#2d5a3f] focus:outline-none focus:ring-2 focus:ring-[#39704D] focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-colors cursor-pointer"
      title="About badges"
      aria-label="About badges"
    >
      1
    </button>
  </app-prayer-update-row>
</app-info-home-filter-preview-prayer-mock>
