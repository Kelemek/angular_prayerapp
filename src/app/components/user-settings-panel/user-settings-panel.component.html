<div class="settings-modal-body settings-modal-sections flex-1 min-h-0 overflow-y-auto p-4 sm:p-6">
  <app-user-settings-print-section [host]="host" />
  <app-user-settings-appearance-section [host]="host" />
  <app-user-settings-notifications-section [host]="host" />
  <app-user-settings-prayer-encouragement-section [host]="host" />
  <app-user-settings-default-view-section [host]="host" />
  <app-user-settings-memorization-practice-section [host]="host" />

  <app-hour-reminder-settings-section
    kind="memorization"
    title="Memorization reminders"
    description="Pick times (15-minute steps) for a short memorization nudge. Delivers by email and/or push when those are on."
    [email]="host.email"
    [isOpen]="host.isOpen"
    tourSectionId="tour-settings-memorization-reminders"
    tourControlsId="tour-settings-memorization-reminder-controls"
    hourSelectId="memorization-reminder-hour-select"
    hourSelectLabel="Memorization reminder time"
    addButtonTitle="Add a memorization reminder for the selected time"
  />

  <app-user-settings-error-banner [host]="host" />

  <app-hour-reminder-settings-section
    kind="prayer"
    title="Prayer reminders"
    description="Pick times (15-minute steps) for a short prayer nudge. Delivers by email and/or push when those are on. Use the bell on a prayer card for a reminder on a specific prayer."
    [email]="host.email"
    [isOpen]="host.isOpen"
    tourSectionId="tour-settings-prayer-reminders"
    tourControlsId="tour-settings-prayer-reminder-controls"
    hourSelectId="reminder-hour-select"
    hourSelectLabel="Reminder time"
    addButtonTitle="Add a prayer reminder for the selected time"
  />

  <app-user-settings-feedback-section [host]="host" />
  <app-user-settings-account-section [host]="host" />
</div>
<div
  class="settings-modal-footer flex shrink-0 flex-row gap-2 p-4 sm:gap-3 sm:p-6"
>
  <button
    (click)="host.logout()"
    title="Sign out of your account"
    class="flex items-center justify-center gap-2 px-4 py-2 sm:py-2.5 btn-chip btn-chip-gray text-sm sm:text-base"
    aria-label="Logout"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Logout</span>
  </button>
</div>
