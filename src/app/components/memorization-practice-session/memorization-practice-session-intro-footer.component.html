<div class="shrink-0 modal-chrome-footer px-4 py-3" data-testid="memorize-intro-footer">
  <div class="flex min-w-0 flex-col gap-3 sm:flex-row sm:items-end">
    <button
      type="button"
      data-tour="memorize-start-practice"
      (click)="ctx.openModePicker()"
      class="w-full sm:w-auto sm:shrink-0 px-4 py-3 text-center {{ ctx.practiceBlueBtnClass }}"
    >
      Start practice
    </button>
    <div class="min-w-0 flex flex-col gap-1.5">
      <span class="text-xs font-medium text-gray-600 dark:text-gray-400 px-0.5">Round</span>
      <div class="flex gap-1.5" role="radiogroup" aria-label="Starting round (1 to 5)">
        @for (opt of ctx.startRoundOptions; track opt.value) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="startRoundChoice === opt.value"
            [attr.aria-label]="opt.label"
            (click)="ctx.startRoundChoice = opt.value"
            class="min-h-[50px] min-w-[2.75rem] flex-1 sm:flex-none px-2 py-2.5 text-sm rounded-lg font-medium transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 dark:focus-visible:ring-offset-gray-900"
            [class]="
              startRoundChoice === opt.value
                ? ctx.practiceBlueBtnFillClass
                : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-200 hover:border-gray-400 dark:hover:border-gray-500'
            "
          >
            {{ opt.value }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
