<div class="shrink-0 modal-chrome-border-t px-4 py-3" data-testid="memorize-recite-footer">
  <div class="flex flex-col sm:flex-row gap-3 sm:justify-end">
    @if (recitePhase === 'ready') {
      <button
        type="button"
        data-testid="memorize-recite-record"
        (click)="ctx.startReciteRecording()"
        [disabled]="!reciteSettingsLoadedForRecord || reciteStarting"
        [attr.aria-busy]="!reciteSettingsLoadedForRecord || reciteStarting"
        class="w-full sm:w-auto px-4 py-3 rounded-lg font-medium transition-colors bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-700"
        [class.cursor-pointer]="reciteSettingsLoadedForRecord && !reciteStarting"
        [class.hover:bg-red-200]="reciteSettingsLoadedForRecord && !reciteStarting"
        [class.dark:hover:bg-red-900/60]="reciteSettingsLoadedForRecord && !reciteStarting"
        [class.cursor-not-allowed]="!reciteSettingsLoadedForRecord || reciteStarting"
        [class.opacity-80]="!reciteSettingsLoadedForRecord || reciteStarting"
      >
        {{
          reciteStarting
            ? 'Starting…'
            : reciteSettingsLoadedForRecord
              ? 'Record'
              : 'Loading…'
        }}
      </button>
    } @else if (recitePhase === 'recording') {
      <button
        type="button"
        data-testid="memorize-recite-stop"
        (click)="ctx.stopReciteRecording()"
        class="w-full sm:w-auto px-4 py-3 rounded-lg font-medium transition-colors cursor-pointer bg-red-100 dark:bg-red-900/40 hover:bg-red-200 dark:hover:bg-red-900/60 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-700"
      >
        Stop
      </button>
    } @else if (recitePhase === 'stopping' || recitePhase === 'transcribing') {
      <button
        type="button"
        data-testid="memorize-recite-checking"
        disabled
        aria-busy="true"
        class="w-full sm:w-auto px-4 py-3 rounded-lg font-medium transition-colors cursor-not-allowed bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-700 inline-flex items-center justify-center gap-2 opacity-80"
      >
        <span
          class="animate-spin rounded-full h-4 w-4 border-2 border-red-800 border-t-transparent dark:border-red-200 dark:border-t-transparent"
          aria-hidden="true"
        ></span>
        Checking…
      </button>
    } @else if (recitePhase === 'results') {
      <button
        type="button"
        data-testid="memorize-recite-help"
        (click)="ctx.openReciteFeedbackHelp()"
        class="w-full sm:w-auto px-4 py-3 rounded-lg font-medium border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer inline-flex items-center justify-center gap-2"
      >
        <svg
          class="w-5 h-5 shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        Help
      </button>
      <button
        type="button"
        data-testid="memorize-recite-retry"
        (click)="ctx.onReciteRepeatRound()"
        class="w-full sm:w-auto px-4 py-3 rounded-lg font-medium border-2 border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer"
      >
        Repeat this round
      </button>
      @if (showReciteNextRoundOption) {
        <button
          type="button"
          data-testid="memorize-recite-next-round"
          (click)="ctx.onReciteNextRound()"
          class="w-full sm:w-auto px-4 py-3 {{ ctx.practiceBlueBtnClass }}"
        >
          Next round
        </button>
      }
      @if (showReciteFinishOption) {
        <button
          type="button"
          data-testid="memorize-recite-finish"
          (click)="ctx.onReciteFinishPractice()"
          class="w-full sm:w-auto px-4 py-3 {{ ctx.practiceBlueBtnClass }}"
        >
          Finish practice
        </button>
      }
    }
  </div>
</div>
