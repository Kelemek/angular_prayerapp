<div class="space-y-4">
<ul class="space-y-2">
  @for (member of members; track member.user_email) {
  <li class="flex items-center justify-between gap-2 text-sm">
    <label class="flex min-w-0 items-center gap-2">
      @if (showOwnerPick(member)) {
      <input
        type="checkbox"
        class="rounded border-gray-900 dark:border-white focus:ring-2 focus:ring-[#39704D]"
        [checked]="isOwnerPick(member.user_email)"
        [attr.aria-label]="'Make ' + (member.name || member.user_email) + ' an owner'"
        (change)="toggleOwnerPick(member.user_email, $event)"
      />
      }
      <span class="min-w-0">
        <span class="block truncate text-gray-800 dark:text-gray-100">{{ member.name || member.user_email }}</span>
        <span class="block text-xs capitalize text-gray-500">{{ member.role }}</span>
      </span>
    </label>
    <span class="flex shrink-0 items-center gap-3">
      @if (showOtherOwnerActions(member)) {
      <button type="button" class="cursor-pointer text-sm font-medium text-gray-700 dark:text-gray-200" (click)="askDemote(member.user_email)">Make member</button>
      }
      @if (showRemove(member)) {
      <button type="button" class="cursor-pointer text-sm font-medium text-red-600" (click)="removeMember(member.user_email)">Remove</button>
      }
    </span>
  </li>
  }
</ul>
@if (group.role === 'owner' && ownerPick.length > 0) {
<button
  type="button"
  class="min-h-11 px-4 py-2 text-sm font-medium btn-chip btn-chip-blue disabled:cursor-not-allowed disabled:opacity-50"
  (click)="promoteSelected()"
  [disabled]="submitting"
>
  Make owner
</button>
}
<ng-content />
</div>

@if (pendingDemoteEmail) {
<app-confirmation-dialog
  title="Make member?"
  [message]="demoteConfirmMessage"
  confirmText="Make member"
  (confirm)="confirmDemote()"
  (cancel)="cancelDemote()"
/>
}
