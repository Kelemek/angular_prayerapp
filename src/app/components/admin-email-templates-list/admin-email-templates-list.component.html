<label
  class="block text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3"
  >Available Templates</label
>
<div class="space-y-3">
  @for (template of templates; track template.id) {
    <div class="rounded-lg border border-gray-200 dark:border-gray-600 overflow-hidden">
      <button
        type="button"
        (pointerdown)="onHeaderPointerDown($event)"
        (mousedown)="onHeaderPointerDown($event)"
        (keydown)="onHeaderKeyDown($event)"
        (click)="onHeaderClick(template, $event)"
        [attr.aria-expanded]="selectedId === template.id"
        [attr.aria-controls]="'email-template-editor-' + template.id"
        [class]="
          'w-full text-left p-3 transition-colors cursor-pointer flex min-h-12 items-center justify-between gap-3 ' +
          (selectedId === template.id
            ? 'bg-blue-50 dark:bg-blue-900/20 border-b border-blue-200 dark:border-blue-800'
            : 'bg-gray-50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700')
        "
      >
        <span class="min-w-0 flex-1">
          <span class="block font-semibold text-gray-900 dark:text-gray-100">
            {{ template.name }}
          </span>
          <span class="block text-xs text-gray-600 dark:text-gray-400 mt-1">
            {{ template.template_key }}
          </span>
        </span>
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="shrink-0 text-gray-500 dark:text-gray-400 transition-transform duration-200"
          [class.rotate-180]="selectedId === template.id"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      @if (selectedId === template.id && editedTemplate) {
        <div
          [id]="'email-template-editor-' + template.id"
          class="p-3 pt-0 bg-blue-50/50 dark:bg-blue-900/10"
          (pointerdown)="onEditorPointerActivity($event)"
          (mousedown)="onEditorPointerActivity($event)"
          (pointerup.capture)="onEditorPointerActivity($event)"
          (mouseup.capture)="onEditorPointerActivity($event)"
          (click)="$event.stopPropagation()"
        >
          <app-admin-email-templates-editor
            [editedTemplate]="editedTemplate"
            [showPreview]="showPreview"
            [saving]="saving"
            [error]="error"
            [success]="success"
            (editInteraction)="onEditInteraction()"
            (togglePreview)="togglePreview.emit()"
            (save)="save.emit()"
            (revert)="revert.emit()"
          ></app-admin-email-templates-editor>
        </div>
      }
    </div>
  }
</div>
