<div class="contrast-chip-surface flex items-center gap-2 min-w-0 sm:justify-between">
  <div [class]="logoToolbarSlotClass">
    <img
      [src]="brandingImageUrl || '/favicon.ico'"
      alt="Church Logo"
      class="h-10 w-auto max-w-full object-contain object-left rounded"
    />
  </div>
  <div class="flex items-center gap-1 sm:gap-2 flex-nowrap shrink-0">
    <button
      type="button"
      (click)="openHeaderPreview.emit('help')"
      [class]="headerChipClass + ' btn-chip btn-chip-gray'"
      title="Help & Guidance"
      aria-label="Help & Guidance"
    >
      <svg
        [class]="headerIconClass"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="10"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        ></circle>
        <text
          x="12"
          y="16"
          text-anchor="middle"
          fill="currentColor"
          font-size="14"
          font-weight="bold"
        >
          ?
        </text>
      </svg>
    </button>
    <button
      type="button"
      (click)="toggleSearch.emit()"
      [attr.aria-expanded]="showSearchPanel ? 'true' : 'false'"
      aria-controls="info-mock-search-panel"
      title="Search"
      aria-label="Search"
      [class]="headerChipClass + ' btn-chip btn-chip-gray'"
    >
      <svg
        [class]="headerIconClass"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
    </button>
    <button
      type="button"
      (click)="openHeaderPreview.emit('settings')"
      [class]="headerChipClass + ' btn-chip btn-chip-gray'"
      title="Settings"
      aria-label="Settings"
    >
      <svg
        [class]="headerIconClass"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
        ></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <button
      type="button"
      (click)="openHeaderPreview.emit('pray')"
      [class]="headerChipClass + ' btn-chip btn-chip-green'"
      title="Pray"
    >
      <span>Pray</span>
    </button>
    <button
      type="button"
      (click)="openHeaderPreview.emit('request')"
      [class]="headerChipClass + ' btn-chip btn-chip-blue'"
      title="Request"
    >
      <span>Request</span>
    </button>
  </div>
</div>
