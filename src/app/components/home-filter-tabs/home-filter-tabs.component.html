      <div [class]="tabRowMarginClass + ' flex w-full gap-1'">
        @let currentBadge = (currentPrayerBadge$ | async) ?? 0;
        @let answeredBadge = (answeredPrayerBadge$ | async) ?? 0;
        @let aggregateBadge = currentBadge + answeredBadge;
        @let promptCount = (promptBadge$ | async) ?? 0;
        @let badgesEnabled = (badgeService.getBadgeFunctionalityEnabled$() | async);
        <button
          id="tour-filter-public"
          (click)="publicTabSelected.emit()"
          title="Show public prayers"
          [class]="tabClass('public', isPublicTabFilter(activeFilter))"
        >
          @if (badgesEnabled && aggregateBadge > 0) {
          <app-home-filter-badge-button
            [count]="aggregateBadge"
            [compact]="true"
            title="Mark all public prayers as read"
            ariaLabel="Mark all public prayers as read"
            (markRead)="markAllPublicPrayersRead()"
          />
          }
          <div
            class="text-sm sm:text-base font-bold text-gray-700 dark:text-gray-300 tabular-nums leading-tight"
          >
            {{ totalPrayersCount }}
          </div>
          <div class="text-[11px] sm:text-xs text-gray-600 dark:text-gray-300 leading-tight">
            Public
          </div>
        </button>

        <!-- Personal Prayers Filter -->
        <button
          id="tour-filter-personal"
          (click)="tabSelected.emit('personal')"
          title="Show your personal prayers"
          [class]="tabClass('personal', activeFilter === 'personal')"
        >
          <div
            class="text-sm sm:text-base font-bold text-gray-700 dark:text-gray-300 tabular-nums leading-tight"
          >
            {{ personalPrayersCount }}
          </div>
          <div class="text-[11px] sm:text-xs text-gray-600 dark:text-gray-300 leading-tight">
            Personal
          </div>
        </button>

        <button
          id="tour-filter-prompts"
          (click)="tabSelected.emit('prompts')"
          title="Show prayer prompts"
          [class]="tabClass('prompts', activeFilter === 'prompts')"
        >
          @if (badgesEnabled && promptCount > 0) {
          <app-home-filter-badge-button
            [count]="promptCount"
            title="Mark all prompts as read"
            ariaLabel="Mark all prompts as read"
            (markRead)="badgeService.markAllAsRead('prompts')"
          />
          }
          <div
            class="text-sm sm:text-base font-bold text-gray-700 dark:text-gray-300 tabular-nums leading-tight"
          >
            {{ promptsCount }}
          </div>
          <div class="text-[11px] sm:text-xs text-gray-600 dark:text-gray-300 leading-tight">
            Prompts
          </div>
        </button>

        <button
          id="tour-filter-memorize"
          (click)="tabSelected.emit('memorize')"
          title="Memorize Bible verses"
          [class]="tabClass('memorize', activeFilter === 'memorize')"
        >
          <div
            class="text-sm sm:text-base font-bold text-gray-700 dark:text-gray-300 tabular-nums leading-tight"
          >
            {{ memorizedItemsCount }}
          </div>
          <div class="text-[11px] sm:text-xs text-gray-600 dark:text-gray-300 leading-tight">
            Memorize
          </div>
        </button>
      </div>
