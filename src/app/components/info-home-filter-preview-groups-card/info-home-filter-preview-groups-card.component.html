<div
  class="relative bg-gray-100/80 dark:bg-white/5 border-[2px] !border-[var(--home-tab-groups-border)] rounded-lg p-4 sm:p-5 shadow-md space-y-3"
>
  <span
    class="absolute left-1/2 top-4 transform -translate-x-1/2 -translate-y-1/2 text-xs text-gray-500 dark:text-gray-400"
    >Feb 3, 2026</span
  >
  <div class="mb-1 flex flex-wrap items-center gap-2">
    <span class="text-sm font-semibold text-gray-900 dark:text-gray-100"
      >Prayer for Mom’s surgery</span
    >
    <span
      class="px-2 py-0.5 text-xs font-medium rounded-full bg-[var(--home-tab-groups-bg)] dark:bg-[var(--home-tab-groups-bg-dark)] text-gray-800 dark:text-gray-100 border border-[var(--home-tab-groups-border)]"
      >{{ groupLabel() }}</span
    >
    <span
      class="px-2 py-0.5 text-xs font-medium rounded-full bg-gray-200/80 dark:bg-gray-700/60 text-gray-700 dark:text-gray-200"
      >{{ statusLabel() }}</span
    >
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300">
    Share prayer needs with your group, add updates as things change, and let
    others know you prayed. Only invited members see this list.
  </p>
  <div class="flex flex-wrap gap-1 items-center">
    <span
      class="px-3 py-1 text-xs font-medium btn-chip btn-chip-green opacity-90"
      >Add Update</span
    >
    <span class="px-3 py-1 text-xs font-medium btn-chip btn-chip-blue opacity-90"
      >Pray For</span
    >
  </div>
</div>
