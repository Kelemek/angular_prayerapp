<app-presentation-settings-section-card
  tourAnchorId="tour-presentation-setting-theme"
  title="Theme Preference"
  subtitle="Pick a theme family and Light, Dark, or System (follows your device within that family)"
  headerClass="mb-3"
>
  <app-presentation-settings-theme-picker
    [theme]="theme"
    (themeChange)="themeChange.emit($event)"
  />
</app-presentation-settings-section-card>
