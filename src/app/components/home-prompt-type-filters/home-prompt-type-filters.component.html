      <div [class]="sectionGapClass + ' flex w-full flex-wrap gap-2'" id="tour-prompt-type-filters">
        @let badgesEnabled = (badgeService.getBadgeFunctionalityEnabled$() | async);
        <app-home-sub-filter-chip
          [stretch]="false"
          [layoutClass]="chipWrapClass"
          [active]="selectedPromptTypes.length === 0"
          [activeClass]="promptTypeActiveClass"
          [inactiveClass]="promptTypeInactiveClass"
          (chipClick)="clearTypes.emit()"
        >
          All Types ({{ promptsCount }})
        </app-home-sub-filter-chip>

        @for (type of uniquePromptTypes; track type) {
        <app-home-sub-filter-chip
          [stretch]="false"
          [layoutClass]="chipWrapClass"
          [active]="selectedPromptTypes.includes(type)"
          [activeClass]="promptTypeActiveClass"
          [inactiveClass]="promptTypeInactiveClass"
          [badgeOverlay]="true"
          (chipClick)="toggleType.emit(type)"
        >
          {{ type }} ({{ getPromptCountByType(type) }})
          @if (badgesEnabled && getUnreadPromptCountByType(type) > 0) {
          <app-home-filter-badge-button
            [count]="getUnreadPromptCountByType(type)"
            [title]="'Mark all ' + type + ' prompts as read'"
            [ariaLabel]="'Mark all ' + type + ' prompts as read'"
            (markRead)="badgeService.markAllAsReadByPromptType(type)"
          />
          }
        </app-home-sub-filter-chip>
        }
      </div>
