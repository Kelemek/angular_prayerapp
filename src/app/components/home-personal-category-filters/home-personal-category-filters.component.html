<div id="tour-personal-category-filters" [class]="sectionGapClass">
  <div [class]="subFilterGroupClass">
  <div [class]="chipRowClass">
    <app-home-sub-filter-chip
      chipId="tour-filter-add-personal-category"
      chipAriaLabel="Add a prayer or category"
      [stretch]="false"
      [active]="false"
      [layoutClass]="addCategoryChipLayoutClass"
      [activeClass]="personalCategoryActiveClass"
      [inactiveClass]="namedChipInactiveClass"
      (chipClick)="openAddChooser()"
    >
      <svg
        class="size-6 shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </app-home-sub-filter-chip>

    <app-home-sub-filter-chip
      [active]="filterMode === 'current'"
      [activeClass]="personalCategoryActiveClass"
      [inactiveClass]="namedChipInactiveClass"
      (chipClick)="selectFilterMode.emit('current')"
    >
      Current ({{ personalCurrentCount }})
    </app-home-sub-filter-chip>

    <app-home-sub-filter-chip
      [active]="filterMode === 'answered'"
      [activeClass]="personalCategoryActiveClass"
      [inactiveClass]="namedChipInactiveClass"
      (chipClick)="selectFilterMode.emit('answered')"
    >
      Answered ({{ personalAnsweredCount }})
    </app-home-sub-filter-chip>

    <app-home-sub-filter-chip
      [active]="filterMode === 'total'"
      [activeClass]="personalCategoryActiveClass"
      [inactiveClass]="namedChipInactiveClass"
      (chipClick)="selectFilterMode.emit('total')"
    >
      Total ({{ personalPrayersCount }})
    </app-home-sub-filter-chip>
  </div>

  @if (uniqueCategories.length > 0) {
  <div
    cdkDropList
    cdkDropListOrientation="mixed"
    [cdkDropListData]="uniqueCategories"
    (cdkDropListDropped)="categoryDrop.emit($event)"
    [cdkDropListDisabled]="isCategoryDropListDisabled || !chipReorderHandlesVisible"
    [class]="chipRowClass + ' mt-2'"
  >
    @for (category of uniqueCategories; track category) {
    <div
      cdkDrag
      [cdkDragData]="category"
      [attr.data-personal-category-chip]="category"
      [cdkDragDisabled]="isCategorySwapping(category) || !chipReorderHandlesVisible"
      (cdkDragStarted)="categoryDragStarted.emit()"
      (cdkDragEnded)="categoryDragEnded.emit()"
      [class]="chipHostClass"
    >
      <div [class]="categoryChipShellClass(category)">
        @if (chipReorderHandlesVisible) {
        <span
          cdkDragHandle
          data-personal-category-drag-handle
          class="absolute inset-y-0 left-0 flex w-7 items-center justify-center"
          aria-hidden="true"
          (pointerdown)="$event.stopPropagation()"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            [class]="
              'pointer-events-none flex-shrink-0 ' +
              (isCategorySwapping(category)
                ? 'cursor-not-allowed'
                : 'cursor-grab')
            "
          >
            <circle cx="9" cy="5" r="1"></circle>
            <circle cx="9" cy="12" r="1"></circle>
            <circle cx="9" cy="19" r="1"></circle>
            <circle cx="15" cy="5" r="1"></circle>
            <circle cx="15" cy="12" r="1"></circle>
            <circle cx="15" cy="19" r="1"></circle>
          </svg>
        </span>
        }
        <button
          type="button"
          class="flex h-full min-h-0 min-w-0 flex-1 items-center justify-center border-0 bg-transparent px-2 text-center text-xs font-medium leading-none text-inherit cursor-pointer disabled:cursor-not-allowed"
          [disabled]="isCategorySwapping(category)"
          (click)="toggleCategory.emit(category)"
        >
          {{ category }} ({{ getCategoryCount(category) }})
          @if (isCategorySwapping(category)) {
          <svg
            class="ml-1 h-4 w-4 shrink-0 animate-spin"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          }
        </button>
        <span
          class="inline-flex shrink-0 items-center pr-1"
          (pointerdown)="$event.stopPropagation()"
        >
          <app-card-actions-overflow-menu
            [items]="categoryOverflowItems(category)"
            bandSize="sm"
            [chipTrigger]="true"
          />
        </span>
      </div>
    </div>
    }
  </div>
  }
  </div>
</div>

@if (pendingDeletePersonalCategory) {
<app-confirmation-dialog
  title="Delete category?"
  [message]="personalCategoryDeleteMessage"
  confirmText="Delete"
  [isDangerous]="true"
  (confirm)="confirmDeletePersonalCategory.emit()"
  (cancel)="cancelDeletePersonalCategory.emit()"
/>
}

<app-home-add-choice-modal
  [isOpen]="addChooserOpen"
  title="Add to Personal"
  [options]="personalAddChoices"
  (choose)="onAddChoice($event)"
  (close)="closeAddChooser()"
/>
