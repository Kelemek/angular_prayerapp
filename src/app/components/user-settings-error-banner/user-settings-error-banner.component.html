<!-- Error Message -->
      @if (host.error) {
      <div
        class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-lg p-3"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="flex items-start gap-2">
          <svg
            class="text-red-600 dark:text-red-400 flex-shrink-0 mt-0.5"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            ></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <p class="text-sm text-red-800 dark:text-red-200">{{ host.error }}</p>
        </div>
      </div>
      }
