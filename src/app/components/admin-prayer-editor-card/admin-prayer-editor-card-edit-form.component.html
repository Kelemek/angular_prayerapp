                <!-- Edit Mode Form -->
                <div
                  class="space-y-4"
                  [attr.id]="card.index === 0 ? 'tour-prayer-editor-edit-form' : null"
                >
                  <div
                    [attr.id]="
                      card.index === 0 ? 'tour-prayer-editor-edit-field-title' : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Title *
                    </label>
                    <input
                      type="text"
                      [(ngModel)]="card.editForm.title"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                      placeholder="Prayer title"
                    />
                  </div>

                  <div
                    [attr.id]="
                      card.index === 0
                        ? 'tour-prayer-editor-edit-field-description'
                        : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Description *
                    </label>
                    <app-rich-text-editor
                      #editPrayerDescriptionEditor
                      [(ngModel)]="card.editForm.description"
                      [name]="'editPrayerDescription-' + card.index"
                      ngDefaultControl
                      ariaLabel="Prayer description"
                      placeholder="Prayer description"
                      minHeight="6rem"
                    ></app-rich-text-editor>
                  </div>

                  <div
                    class="grid grid-cols-1 md:grid-cols-2 gap-4"
                    [attr.id]="
                      card.index === 0
                        ? 'tour-prayer-editor-edit-field-requester-email'
                        : null
                    "
                  >
                    <div>
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Requester *
                      </label>
                      <input
                        type="text"
                        [(ngModel)]="card.editForm.requester"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        placeholder="Requester name"
                      />
                    </div>

                    <div>
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Email
                      </label>
                      <input
                        type="email"
                        [(ngModel)]="card.editForm.email"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        placeholder="Email address"
                      />
                    </div>
                  </div>

                  <div
                    [attr.id]="
                      card.index === 0
                        ? 'tour-prayer-editor-edit-field-praying-for'
                        : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Praying For
                    </label>
                    <input
                      type="text"
                      [(ngModel)]="card.editForm.prayer_for"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                      placeholder="Person being prayed for"
                    />
                  </div>

                  <div
                    [attr.id]="
                      card.index === 0 ? 'tour-prayer-editor-edit-field-status' : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Status *
                    </label>
                    <div class="relative">
                      <select
                        [(ngModel)]="card.editForm.status"
                        class="w-full appearance-none px-3 py-2 text-sm border border-blue-300 dark:border-blue-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10 cursor-pointer"
                      >
                        <option value="current">Current</option>
                        <option value="answered">Answered</option>
                        <option value="archived">Archived</option>
                      </select>
                      <svg
                        class="pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-blue-600 dark:text-blue-400"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </div>
                  </div>
                </div>
