                <!-- Edit Mode Form -->
                <div
                  class="space-y-4"
                  [attr.id]="ctx.index === 0 ? 'tour-prayer-editor-edit-form' : null"
                >
                  <div
                    [attr.id]="
                      ctx.index === 0 ? 'tour-prayer-editor-edit-field-title' : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Title *
                    </label>
                    <input
                      type="text"
                      [(ngModel)]="ctx.editForm.title"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                      placeholder="Prayer title"
                    />
                  </div>

                  <div
                    [attr.id]="
                      ctx.index === 0
                        ? 'tour-prayer-editor-edit-field-description'
                        : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Description *
                    </label>
                    <app-rich-text-editor
                      #editPrayerDescriptionEditor
                      [(ngModel)]="ctx.editForm.description"
                      [name]="'editPrayerDescription-' + ctx.index"
                      ngDefaultControl
                      ariaLabel="Prayer description"
                      placeholder="Prayer description"
                      minHeight="6rem"
                    ></app-rich-text-editor>
                  </div>

                  <div
                    class="grid grid-cols-1 md:grid-cols-2 gap-4"
                    [attr.id]="
                      ctx.index === 0
                        ? 'tour-prayer-editor-edit-field-requester-email'
                        : null
                    "
                  >
                    <div>
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Requester *
                      </label>
                      <input
                        type="text"
                        [(ngModel)]="ctx.editForm.requester"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        placeholder="Requester name"
                      />
                    </div>

                    <div>
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Email
                      </label>
                      <input
                        type="email"
                        [(ngModel)]="ctx.editForm.email"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        placeholder="Email address"
                      />
                    </div>
                  </div>

                  <div
                    [attr.id]="
                      ctx.index === 0
                        ? 'tour-prayer-editor-edit-field-praying-for'
                        : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Praying For
                    </label>
                    <input
                      type="text"
                      [(ngModel)]="ctx.editForm.prayer_for"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                      placeholder="Person being prayed for"
                    />
                  </div>

                  <div
                    [attr.id]="
                      ctx.index === 0 ? 'tour-prayer-editor-edit-field-status' : null
                    "
                  >
                    <label
                      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >
                      Status *
                    </label>
                    <app-admin-filter-select
                      [triggerId]="
                        ctx.index === 0
                          ? 'tour-prayer-editor-edit-status'
                          : undefined
                      "
                      [value]="ctx.editForm.status"
                      (valueChange)="ctx.editForm.status = $event"
                      [options]="prayerStatusOptions"
                      ariaLabel="Prayer status"
                    />
                  </div>
                </div>
