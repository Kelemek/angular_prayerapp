<div
  class="px-3 pb-3 pt-2 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 min-w-0"
>
  <div class="space-y-2 min-w-0">
    <div class="flex items-center justify-between mb-3">
      <h5 class="text-sm font-semibold text-gray-900 dark:text-gray-100">
        {{
          card.isEditing ? 'Edit Prayer Details' : 'Complete Prayer Details'
        }}
      </h5>
      @if (card.isEditing) {
        <div class="flex gap-2">
          <button
            type="button"
            (click)="card.onSaveEditClick()"
            [disabled]="card.saving"
            class="flex items-center gap-1 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm disabled:opacity-50 cursor-pointer"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              ></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            {{ card.saving ? 'Saving...' : 'Save' }}
          </button>
          <button
            type="button"
            [attr.id]="
              card.index === 0 ? 'tour-prayer-editor-edit-cancel-first' : null
            "
            (click)="card.onCancelEditClick()"
            [disabled]="card.saving"
            class="flex items-center gap-1 px-3 py-1 bg-gray-500 hover:bg-gray-600 text-white rounded-lg text-sm disabled:opacity-50 cursor-pointer"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Cancel
          </button>
        </div>
      }
    </div>

    @if (card.isEditing) {
      <app-admin-prayer-editor-card-edit-form [card]="card" />
    }
    @if (!card.isEditing) {
      <app-admin-prayer-editor-card-view-details [card]="card" />
    }

    <app-admin-prayer-editor-card-updates [card]="card" />

    @if (!card.anyPrayerEditing) {
      <app-admin-prayer-editor-card-add-update [card]="card" />
    }
  </div>
</div>
