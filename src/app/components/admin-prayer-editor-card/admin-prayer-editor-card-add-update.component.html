                <!-- Add Update Section -->
                <div
                  class="bg-gray-50 dark:bg-gray-900/50 p-3 rounded-lg border border-gray-200 dark:border-gray-700"
                  [attr.id]="
                    card.index === 0 ? 'tour-prayer-editor-add-update-section' : null
                  "
                >
                  @if (card.isAddingUpdate) {
                  <div
                    class="space-y-3"
                    [attr.id]="
                      card.index === 0 ? 'tour-prayer-editor-add-update-form' : null
                    "
                  >
                    <div class="flex items-center justify-between mb-2">
                      <h6
                        class="text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase"
                      >
                        Add New Update
                      </h6>
                      <div class="flex gap-2">
                        <button
                          type="button"
                          (click)="card.onSaveNewUpdateClick()"
                          [disabled]="!card.isUpdateFormValid() || card.savingUpdate"
                          class="flex items-center gap-1 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                        >
                          <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path
                              d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                            ></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                          </svg>
                          {{ card.savingUpdate ? "Saving..." : "Save Update" }}
                        </button>
                        <button
                          type="button"
                          [attr.id]="
                            card.index === 0
                              ? 'tour-prayer-editor-add-update-cancel-first'
                              : null
                          "
                          (click)="card.onCancelAddUpdateClick()"
                          [disabled]="card.savingUpdate"
                          class="flex items-center gap-1 px-3 py-1 bg-gray-500 hover:bg-gray-600 text-white rounded-lg text-sm disabled:opacity-50 cursor-pointer"
                        >
                          <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                          </svg>
                          Cancel
                        </button>
                      </div>
                    </div>

                    <app-admin-subscriber-pick
                      #addUpdateSubscriberPick
                      [domId]="
                        card.index === 0
                          ? 'tour-prayer-editor-add-update-find-subscriber'
                          : undefined
                      "
                      accent="blue"
                      inputName="addUpdateSubscriberPickQuery"
                      (subscriberSelected)="card.onAddUpdateSubscriberSelected($event)"
                    ></app-admin-subscriber-pick>

                    <div
                      class="grid grid-cols-2 gap-3"
                      [attr.id]="
                        card.index === 0
                          ? 'tour-prayer-editor-add-update-field-names'
                          : null
                      "
                    >
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                        >
                          First Name *
                        </label>
                        <input
                          type="text"
                          [(ngModel)]="card.newUpdate.firstName"
                          required
                          placeholder="First name"
                          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                        >
                          Last Name *
                        </label>
                        <input
                          type="text"
                          [(ngModel)]="card.newUpdate.lastName"
                          required
                          placeholder="Last name"
                          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                    </div>

                    <div
                      [attr.id]="
                        card.index === 0
                          ? 'tour-prayer-editor-add-update-field-author-email'
                          : null
                      "
                    >
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Author Email *
                      </label>
                      <input
                        type="email"
                        [(ngModel)]="card.newUpdate.author_email"
                        required
                        placeholder="email@example.com"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div
                      [attr.id]="
                        card.index === 0
                          ? 'tour-prayer-editor-add-update-field-content'
                          : null
                      "
                    >
                      <label
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                      >
                        Update Content *
                      </label>
                      <app-rich-text-editor
                        [(ngModel)]="card.newUpdate.content"
                        [name]="'newUpdateContent-' + card.prayer.id"
                        ngDefaultControl
                        required
                        ariaLabel="Update content"
                        placeholder="Enter the update content…"
                        minHeight="6rem"
                      ></app-rich-text-editor>
                    </div>
                  </div>
                  } @if (!card.isAddingUpdate) {
                  <button
                    type="button"
                    [attr.id]="
                      card.index === 0 ? 'tour-prayer-editor-add-update-btn' : null
                    "
                    (click)="card.onStartAddUpdateClick()"
                    class="ml-auto flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Update
                  </button>
                  }
                </div>
