<button
  type="button"
  (click)="openPracticePreview.emit()"
  title="See how verse practice works"
  aria-label="See how verse practice works"
  class="relative w-full text-left bg-gray-100/80 dark:bg-white/5 border-[2px] !border-[#0047AB] dark:!border-[#0047AB] rounded-lg p-4 sm:p-5 shadow-md space-y-3 cursor-pointer hover:bg-gray-200/70 dark:hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-[#0047AB] focus:ring-offset-2 dark:focus:ring-offset-gray-800"
>
  <div class="flex flex-wrap items-center gap-2">
    <span class="text-sm font-semibold text-gray-900 dark:text-gray-100"
      >John 3:16</span
    >
    <span class="text-xs text-gray-500 dark:text-gray-400">ESV</span>
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300">
    Save Bible verses and practice them by typing, first letters, choosing words,
    or reciting out loud.
  </p>
  <p class="text-xs text-gray-500 dark:text-gray-500">
    Add your own passages, learn the books of the Bible, or start from a
    recommended list. Open Memorize anytime from the home tabs.
  </p>
  <p class="text-xs font-medium text-[#0047AB] dark:text-blue-300">
    Tap to see each practice mode
  </p>
</button>
