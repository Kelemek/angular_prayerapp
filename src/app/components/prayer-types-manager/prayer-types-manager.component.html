<app-admin-prayer-types-section
  [expanded]="sectionExpanded"
  (toggle)="onSectionToggle()"
>
  <app-admin-prayer-types-panel
    #panelRef
    [showAddForm]="showAddForm"
    [error]="error"
    [success]="success"
    [editingType]="editingType"
    [loading]="loading"
    [types]="types"
    [activeCount]="getActiveCount()"
    (toggleAdd)="toggleAddForm()"
    (typeSaved)="onTypeSaved($event)"
    (closeForm)="closeTypeForm()"
    (formError)="onChildError($event)"
    (editType)="handleEdit($event)"
    (deleteType)="handleDelete($event.id, $event.name)"
    (toggleBooklet)="beginIncludeInBookletToggle($event)"
    (toggleActive)="beginActiveToggle($event)"
    (drop)="onDrop($event)"
  />
</app-admin-prayer-types-section>

<app-admin-prayer-types-dialogs
  #dialogsRef
  (confirmationConfirmed)="onConfirmationConfirmed($event)"
></app-admin-prayer-types-dialogs>
