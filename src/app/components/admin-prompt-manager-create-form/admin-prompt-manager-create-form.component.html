<form
  novalidate
  class="bg-gray-50 dark:bg-gray-900/50 rounded-lg p-4 mb-4 border border-gray-200 dark:border-gray-700"
>
  <div class="flex items-center justify-between mb-4">
    <h4 class="text-md font-semibold text-gray-900 dark:text-gray-100">
      Add New Prayer Prompt
    </h4>
    <button
      type="button"
      (click)="cancel.emit()"
      class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <div class="grid gap-3">
    <div>
      <label
        for="title"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Title *
      </label>
      <input
        type="text"
        id="title"
        [(ngModel)]="title"
        name="title"
        (keydown.enter)="onPromptTitleEnter($event)"
        placeholder="e.g., Pray for those in need"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>
    <div>
      <label
        for="type"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Type *
      </label>
      <div class="relative">
        <select
          id="type"
          [(ngModel)]="type"
          name="type"
          class="w-full appearance-none px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10 cursor-pointer"
        >
          @if (prayerTypes.length === 0) {
          <option value="">Loading types...</option>
          } @for (t of prayerTypes; track t.id) {
          <option [value]="t.name">{{ t.name }}</option>
          }
        </select>
        <svg
          class="pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-600 dark:text-gray-400"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
    <div>
      <label
        for="description"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Description *
      </label>
      <textarea
        id="description"
        [(ngModel)]="description"
        name="description"
        placeholder="Write a prayer or meditation prompt..."
        rows="4"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      ></textarea>
    </div>
  </div>
  <div class="mt-3 space-y-2">
    @if (submitting) {
    <div
      class="flex items-center gap-2 text-sm text-blue-700 dark:text-blue-300"
      role="status"
      aria-live="polite"
    >
      <span
        class="inline-block h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-blue-600 border-t-transparent dark:border-blue-400 dark:border-t-transparent"
        aria-hidden="true"
      ></span>
      <span>Saving…</span>
    </div>
    }
    <div class="flex gap-2">
      <button
        type="button"
        (click)="savePrompt()"
        [disabled]="submitting"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-blue-400 transition-colors text-sm"
      >
        {{ submitting ? 'Saving…' : 'Add Prompt' }}
      </button>
      <button
        type="button"
        (click)="cancel.emit()"
        [disabled]="submitting"
        class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-50 disabled:pointer-events-none transition-colors text-sm cursor-pointer"
      >
        Cancel
      </button>
    </div>
  </div>
</form>
