<div
  id="tour-email-subscribers-pagination"
  class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 space-y-4"
>
  <div class="flex items-center justify-between text-sm">
    <span class="text-gray-600 dark:text-gray-400">
      Found: <span class="font-semibold">{{ totalItems }}</span> subscriber(s) |
      Showing:
      <span class="font-semibold"
        >{{ (currentPage - 1) * pageSize + 1 }}-{{
          Math.min(currentPage * pageSize, totalItems)
        }}</span
      >
    </span>
    <span class="text-gray-600 dark:text-gray-400">
      Active:
      <span class="font-semibold text-green-600 dark:text-green-400">
        {{ activeCount }}
      </span>
    </span>
  </div>

  <div class="flex items-center gap-2">
    <label for="pageSize" class="text-sm text-gray-600 dark:text-gray-400"
      >Items per page:</label
    >
    <div class="w-[4.75rem] shrink-0">
      <app-admin-filter-select
        triggerId="pageSize"
        [value]="pageSize.toString()"
        (valueChange)="onPageSizeChange($event)"
        [options]="pageSizeOptions"
        ariaLabel="Items per page"
      />
    </div>
  </div>

  @if (totalPages > 1) {
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex gap-2">
        <button
          type="button"
          (click)="previousPage.emit()"
          [disabled]="isFirstPage"
          class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm cursor-pointer"
        >
          ← Previous
        </button>
        <button
          type="button"
          (click)="nextPage.emit()"
          [disabled]="isLastPage"
          class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm cursor-pointer"
        >
          Next →
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <span class="text-gray-600 dark:text-gray-400 text-sm">
          Page <span class="font-semibold">{{ currentPage }}</span> of
          <span class="font-semibold">{{ totalPages }}</span>
        </span>

        <div class="flex gap-1">
          @for (page of paginationRange; track page) {
            <button
              type="button"
              (click)="goToPage.emit(page)"
              [class]="
                page === currentPage
                  ? 'px-3 py-1 bg-blue-600 text-white rounded-lg text-sm cursor-pointer'
                  : 'px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-sm cursor-pointer'
              "
            >
              {{ page }}
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
