<div class="mb-4">
  <label
    for="mainPrayerSearch"
    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
  >
    Search Prayers
  </label>
  <div class="flex-1 relative">
    <input
      id="mainPrayerSearch"
      type="text"
      name="mainPrayerSearch"
      [ngModel]="searchTerm"
      (ngModelChange)="searchTermChange.emit($event)"
      (keydown)="searchKeydown.emit($event)"
      autocomplete="off"
      [placeholder]="
        'Search by title, requester, email, description, prayer updates, or denial reasons (min. ' +
        mainSearchMinChars +
        ' characters)…'
      "
      class="w-full px-4 py-2 pr-10 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-red-500"
    />
    @if (searching) {
      <div
        class="pointer-events-none absolute right-10 top-1/2 -translate-y-1/2"
      >
        <div
          class="animate-spin rounded-full h-4 w-4 border-2 border-red-600 border-t-transparent"
        ></div>
      </div>
    }
    @if (searchTerm) {
      <button
        type="button"
        (click)="clearSearch.emit()"
        class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    }
  </div>
  <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
    Debounced search ({{ mainSearchDebounceMs }}ms). Update matches use a
    targeted query instead of loading the full list. Results capped at
    {{ mainSearchResultLimit }} prayers.
  </p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
  <div>
    <label
      for="prayer-editor-status-filter"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Prayer Status
    </label>
    <app-admin-filter-select
      triggerId="prayer-editor-status-filter"
      [value]="statusFilter"
      (valueChange)="statusFilterChange.emit($event)"
      placeholder="Select status..."
      [options]="statusFilterOptions"
      ariaLabel="Prayer status filter"
    />
  </div>

  <div>
    <label
      for="prayer-editor-approval-filter"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Approval Status
    </label>
    <app-admin-filter-select
      triggerId="prayer-editor-approval-filter"
      [value]="approvalFilter"
      (valueChange)="approvalFilterChange.emit($event)"
      placeholder="Select approval..."
      [options]="approvalFilterOptions"
      ariaLabel="Approval status filter"
    />
  </div>
</div>
